schema_version: '1.0'
workflow:
  id: speckit
  name: Full SDD Cycle
  version: 1.0.2
  author: GitHub
  description: Runs specify → plan → tasks → implement with review gates
requires:
  speckit_version: '>=0.15.1'
  integrations:
    any:
    - alquimia
    - claude
    - copilot
    - codex
    - gemini
    - opencode
inputs:
  spec:
    type: string
    required: true
    prompt: Describe what you want to build
  integration:
    type: string
    required: true
    prompt: Choose an installed CLI-capable integration for this run (for example,
      codex, claude, or gemini). cursor-agent does not support CLI workflow dispatch.
  speckit_review_spec_verdict:
    type: string
    default: ''
  speckit_review_plan_verdict:
    type: string
    default: ''
steps:
- id: specify
  command: speckit.specify
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: review-spec
  type: gate
  verdict_input: speckit_review_spec_verdict
  message: Review the generated spec before planning.
  options:
  - approve
  - reject
  on_reject: abort
- id: plan
  command: speckit.plan
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: review-plan
  type: gate
  verdict_input: speckit_review_plan_verdict
  message: Review the plan before generating tasks.
  options:
  - approve
  - reject
  on_reject: abort
- id: tasks
  command: speckit.tasks
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
- id: implement
  command: speckit.implement
  integration: '{{ inputs.integration }}'
  input:
    args: '{{ inputs.spec }}'
