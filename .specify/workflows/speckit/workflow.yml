schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.0.2"
  author: "GitHub"
  description: "Runs specify → plan → tasks → implement with review gates"

requires:
  # Gate verdict inputs require CLI 0.15.1 or later.
  speckit_version: ">=0.15.1"
  integrations:
    # Advisory, non-exhaustive examples of integrations with CLI dispatch.
    # CLI workflow runs require an explicit installed integration for the current stage.
    any:
      - "alquimia"
      - "claude"
      - "codex"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    required: true
    prompt: "This input is only for CLI workflow dispatch. The project integration default remains `none` and does not choose an Agent. At each HITL gate, choose the Agent for the next stage. If continuing this CLI workflow, resume with that stage's installed CLI integration; otherwise use the selected Agent's native Spec Kit skills without resuming this workflow."
  speckit_review_spec_verdict:
    type: string
    default: ""
  speckit_review_plan_verdict:
    type: string
    default: ""

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    verdict_input: speckit_review_spec_verdict
    message: "Review the generated spec, then choose the Agent for the next stage. If resuming this CLI workflow, pass that stage's installed CLI integration with `--input integration=<name>`; otherwise continue with the selected Agent's native Spec Kit skills. The project default remains `none`."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    verdict_input: speckit_review_plan_verdict
    message: "Review the plan, then choose the Agent for the next stage. If resuming this CLI workflow, pass that stage's installed CLI integration with `--input integration=<name>`; otherwise continue with the selected Agent's native Spec Kit skills. The project default remains `none`."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
