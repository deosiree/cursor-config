version: "1.0"
skill: "gen-perms"

templates:
  - id: "route-perm-api-map"
    file: "路由-组件-权限点-API 源码梳理.md"
    purpose: "梳理已命中权限指令路由的权限点与 API 证据"
    requiredSections:
      - "说明"
      - "未命中权限指令路由列表"
      - "纳入统计的路由"
    requiredTables:
      - "Route|Route Component|Permission Consumer Components|Permissions|Actual API Calls|API Endpoint Evidence"
      - "apiMethod|apiUrl|description"

  - id: "unhit-route-perm-design"
    file: "未命中-v-hasPerm-静态路由-权限点补齐设计.md"
    purpose: "为未命中权限指令路由提供权限点补齐方案"
    requiredSections:
      - "说明"
      - "## [route]"
      - "### [perm]"
    requiredTables:
      - "路由|对应组件|组件路径"
      - "权限点(按现有风格设计)|对应哪一行(源码行号+业务行)|对应什么代码中"
      - "apiMethod|apiUrl|description"

placeholders:
  route:
    - "${ROUTE_PATH}"
    - "${COMPONENT_NAME}"
    - "${COMPONENT_FILE}"
  permission:
    - "${PERM_KEY}"
    - "${LINE_REF}"
    - "${CODE_REF}"
  api:
    - "${API_METHOD}"
    - "${API_URL}"
    - "${API_DESC}"

headingKeys:
  route: "## ${ROUTE_PATH}"
  permission: "### ${PERM_KEY}"

notes:
  - "占位符仅为模板指引，最终产物必须替换为真实值。"
  - "同一路由下权限点标题应唯一，避免重复 heading。"
