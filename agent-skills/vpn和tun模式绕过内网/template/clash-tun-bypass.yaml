# Clash TUN 模式绕过内网配置模板
# 适用于：FlClash、Clash Verge、Clash for Windows
# 内核要求：Clash Meta / mihomo

# ==========================================
# 方案 1: TUN 路由排除（推荐，最彻底）
# ==========================================

tun:
  enable: true
  stack: system  # 使用系统协议栈（Windows 必须）
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  
  # ========== 关键配置 ==========
  inet4-route-exclude-address:
    - 127.0.0.0/8          # 本地回环（localhost）
    - 10.0.0.0/8           # A类私网（10.x.x.x）
    - 172.16.0.0/12        # B类私网（172.16-31.x.x）
    - 192.168.0.0/16       # C类私网（192.168.x.x）
    - 224.0.0.0/4          # 组播地址
    - 240.0.0.0/4          # 保留地址

# ==========================================
# 方案 2: fake-ip-filter（补充方案）
# ==========================================

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  
  # ========== 关键配置 ==========
  fake-ip-filter:
    # 本地地址（必须）
    - 'localhost'
    - '127.0.0.1'
    - '*.local'
    - '*.lan'
    - '*.localdomain'
    
    # 内网域名（按需添加）
    - '+.yourdomain.com'     # 替换成你的内网域名
    - 't-cloud.lanniu.top'   # 示例
    
    # 标准过滤（保留）
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.home.arpa'

# ==========================================
# 方案 3: Rules 层配置（无效，仅作对比）
# ==========================================

# ⚠️ 注意：rules 在应用层，TUN 在网络层，优先级更低
# 以下配置对 TUN 模式无效，仅作说明

rules:
  # ===== 本地地址直连 =====
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  
  # ===== 内网域名直连 =====
  - DOMAIN-SUFFIX,lanniu.top,DIRECT
  - DOMAIN,t-cloud.lanniu.top,DIRECT

# ==========================================
# 使用说明
# ==========================================

# 1. 选择方案：
#    - 推荐：方案1（TUN路由排除）- 最彻底
#    - 备选：方案1 + 方案2 组合 - 双重保险
#    - 不推荐：只用方案2 - 只解决DNS不解决路由
#    - 无效：只用方案3 - TUN模式下无效

# 2. 修改步骤：
#    a. 备份原配置文件
#    b. 复制对应方案的配置到你的配置文件
#    c. 完全退出 VPN 并重启
#    d. 验证访问

# 3. 验证方法：
#    Windows: route print | findstr "10.17"
#    macOS/Linux: netstat -rn | grep "10.17"
#    
#    预期结果：应该看到类似这样的路由
#    10.17.196.0/24 -> 10.17.77.1 (物理网关) metric 40

# 4. 防止订阅更新覆盖：
#    - FlClash: 使用"配置预处理"或"Mixin"
#    - Clash Verge: 使用"配置文件覆写"
#    - 或手动备份，更新后重新合并

# ==========================================
# 真实案例（本模板基于此案例）
# ==========================================

# 问题现场：
#   本机: 10.17.77.106/24 (WLAN)
#   目标: 10.17.196.39 (跨网段)
#   症状: 开启 TUN 后无法访问

# 尝试方案：
#   1. Rules 层 IP-CIDR → 失败（TUN优先级更高）
#   2. fake-ip-filter → 部分成功（只解决DNS）
#   3. inet4-route-exclude-address → 成功！

# 最终配置：
#   tun:
#     inet4-route-exclude-address:
#       - 10.0.0.0/8

# 效果：
#   FlClash 自动创建路由：
#   10.17.196.0/24 -> 10.17.77.1 (metric 40)
#   
#   访问测试：
#   ✅ http://127.0.0.1:8080
#   ✅ http://10.17.196.39:8080
#   ✅ https://t-cloud.lanniu.top
#   ✅ Kiro 正常工作（外网流量走代理）
