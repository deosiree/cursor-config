name: Issue PR Loop CI
run-name: 'Issue PR Loop CI - PR #${{ github.event.pull_request.number }}'

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Issue PR Loop repository contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Spec Kit integration and Issue PR Loop metadata tests
        run: node --test git-skills/issue-pr-loop/tests/specify-integration.test.mjs
