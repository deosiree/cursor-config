name: Issue PR Loop validation

on:
  pull_request:
    paths:
      - ".specify/**"
      - "git-skills/issue-pr-loop/**"
      - "specs/002-axiomatic-design-analysis/**"
      - ".github/workflows/issue-pr-loop-validation.yml"

jobs:
  validate:
    name: Skill and Spec Kit state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test git-skills/issue-pr-loop/tests/specify-integration.test.mjs
